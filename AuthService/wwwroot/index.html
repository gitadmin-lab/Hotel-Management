<!DOCTYPE html>
<html>
<head>
    <title>Hotel Management</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial;
            /* Background Image */
            background: url('/images/hotel.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.6); /* dark overlay */
            padding: 40px;
            border-radius: 10px;
            color: white;
        }

        h1 {
            margin-bottom: 20px;
        }

        .btn {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login {
            background-color: #4CAF50;
            color: white;
        }

        .signup {
            background-color: #2196F3;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Hotel Management System 🏨</h1>

        <button class="btn login" onclick="goToLogin()">Login</button>
        <button class="btn signup" onclick="goToSignup()">Signup</button>
    </div>

    <script>
function goToLogin() {
    window.location.href = "/login.html";
}

function goToSignup() {
    window.location.href = "/signup.html";
}
    </script>

</body>
</html>
